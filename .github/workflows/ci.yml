name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment); a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No secrets needed: tests mock the RPC edge and the build reads keys only at runtime.
      - run: npm run build
      - run: npm run build:extension

  audit:
    name: Dependency gate (high / critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Blocking. npm audit over the whole tree (production and development dependencies), read from the lockfile.
      # A high or critical advisory fails this job unless scripts/audit-allowlist.json accepts that exact advisory
      # with its path, impact, reason, removal condition and an unexpired review date. Locally: npm run audit:gate
      - run: node scripts/audit-gate.mjs

  guard:
    name: Guard program — build and LiteSVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            guard/target
          key: guard-${{ runner.os }}-${{ hashFiles('guard/Cargo.lock', 'guard/rust-toolchain.toml') }}
      # The release archive itself, checked against the SHA-256 GitHub publishes for the v3.1.10 asset,
      # instead of piping an install script into sh.
      - name: Install Agave (Solana CLI) 3.1.10, checksum verified
        env:
          AGAVE_URL: https://github.com/anza-xyz/agave/releases/download/v3.1.10/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          AGAVE_SHA256: a7205ff29bcf0f7199740225ecae2b85a28ea9668892d5ec21bd9749882984a1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/agave.tar.bz2" "$AGAVE_URL"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$HOME"
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      # rust-toolchain.toml pins the host toolchain; cargo build-sbf uses the Agave platform tools.
      - run: cargo build-sbf --manifest-path programs/presign-guard/Cargo.toml
      - run: cargo test -p presign-guard
