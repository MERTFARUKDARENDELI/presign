<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Nonce Sense logo</title>
<style>
  body { margin: 0; padding: 32px; background: #18181b; color: #a1a1aa; font: 14px/1.4 system-ui, sans-serif; }
  section { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 20px; align-items: center; margin-bottom: 28px; }
  h2 { margin: 0; color: #f4f4f5; font-size: 16px; }
  .dark, .light { border-radius: 16px; padding: 28px; display: flex; gap: 28px; align-items: center; }
  .dark { background: #000; }
  .light { background: #fafafa; }
  img.lockup { height: 96px; }
  img.icon { height: 96px; }
  img.tiny { height: 32px; }
</style>
<section><h2>A · İmzalı Göz</h2>
  <div class="dark"><img class="lockup" src="goz/logo-dark-bg.svg"><img class="tiny" src="goz/icon.svg"></div>
  <div class="light"><img class="lockup" src="goz/logo-light-bg.svg"></div></section>
<section><h2>B · n Monogram</h2>
  <div class="dark"><img class="lockup" src="monogram/logo-dark-bg.svg"><img class="tiny" src="monogram/icon.svg"></div>
  <div class="light"><img class="lockup" src="monogram/logo-light-bg.svg"></div></section>
<section><h2>C · Konsey</h2>
  <div class="dark"><img class="lockup" src="konsey/logo-dark-bg.svg"><img class="tiny" src="konsey/icon.svg"></div>
  <div class="light"><img class="lockup" src="konsey/logo-light-bg.svg"></div></section>
</html>
